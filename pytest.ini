[pytest]
# ===== Test Discovery & Execution =====
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests .
addopts = -v --tb=short

# ===== Logging Configuration =====
# CLI logging (visible during test run)
log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(message)s
log_cli_date_format = %H:%M:%S

# File logging (all details)
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(name)s | %(levelname)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ===== Capture Configuration =====
# Note: -s flag does NOT work with pytest-xdist
# Use pytest.ini logging config instead
console_output_style = progress

# ===== Markers =====
markers =
    slow: mark test as slow (deselect with '-m "not slow"')
    integration: mark test as integration test
    unit: mark test as unit test
    trust_boundary: mark test as trust boundary verification
    multi_turn: multi-turn persistence test — ctx shared across turns
    high_stakes: medical/legal/security/financial domain with elevated risk
    hallucination: false certainty / overclaiming pattern detection
    jailbreak: injection / bypass / override attempt
    benign: should always result in PASS decision
    boundary: tests decision thresholds (PASS/HOLD/REJECT edges)
    mc_stability: Monte Carlo P95 variance and distribution properties

# ===== Xdist Configuration (if using pytest-xdist) =====
# pytest -n auto  (enable xdist with auto worker count)
# Uncomment below for xdist-specific config:
# xdist_worker_count = auto
# xdist_worker_timeout = 300

# ===== Coverage (if using pytest-cov) =====
# addopts = --cov=src --cov-report=html --cov-report=term-missing
